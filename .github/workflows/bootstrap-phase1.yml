name: Bootstrap Phase 1 Toolchain

on:
  push:
    branches:
      - phase-1-money
    paths:
      - .github/workflows/bootstrap-phase1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: phase-1-money

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Phase 1 tooling
        run: |
          npm install --save-dev --save-exact typescript@6 typescript-eslint@8.70.0 fast-check@4.10.2
          npm pkg set scripts.typecheck="tsc --noEmit"
          npm pkg set scripts.check="npm run lint && npm run typecheck && npm test && npm run build"

      - name: Commit lockfile and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build: add Phase 1 TypeScript toolchain"
          git push origin HEAD:phase-1-money
