name: Publish Pulse Counter for GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build for GitHub Pages
        run: npm run build -- --base=/React-counter/

      - name: Stage static site
        run: |
          rm -rf /tmp/pulse-counter-pages
          mkdir -p /tmp/pulse-counter-pages
          cp -R dist/. /tmp/pulse-counter-pages/
          touch /tmp/pulse-counter-pages/.nojekyll

      - name: Publish gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gh-pages
          git rm -rf . || true
          cp -R /tmp/pulse-counter-pages/. .
          git add -A
          git commit -m "deploy: Pulse Counter ${GITHUB_SHA}"
          git push --force origin gh-pages
