name: Publish Shopping Budget Companion

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build public shopping app
        run: npm run build -- --base=/shopping-budget-companion/

      - name: Build guarded shopping timing QA
        env:
          VITE_SHOPPING_QA_TIMING: "1"
        run: |
          npm run build -- --base=/shopping-budget-companion/qa/ --outDir=dist-qa
          npm run qa:prepare-index

      - name: Build guarded retention beta
        env:
          VITE_SHOPPING_BETA_EVIDENCE: "1"
        run: |
          npm run build -- --base=/shopping-budget-companion/beta/ --outDir=dist-beta
          npm run beta:prepare-index

      - name: Stage static site
        run: |
          rm -rf /tmp/shopping-budget-companion-pages
          mkdir -p /tmp/shopping-budget-companion-pages
          cp -R dist/. /tmp/shopping-budget-companion-pages/
          mkdir -p /tmp/shopping-budget-companion-pages/qa
          cp -R dist-qa/. /tmp/shopping-budget-companion-pages/qa/
          mkdir -p /tmp/shopping-budget-companion-pages/beta
          cp -R dist-beta/. /tmp/shopping-budget-companion-pages/beta/
          touch /tmp/shopping-budget-companion-pages/.nojekyll

      - name: Publish gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gh-pages
          git rm -rf . || true
          cp -R /tmp/shopping-budget-companion-pages/. .
          git add -A
          git commit -m "deploy: shopping app + QA/beta ${GITHUB_SHA}"
          git push --force origin gh-pages
