name: Temporary visual experiment lockfile refresh

on:
  push:
    branches:
      - experiment/visual-clip-zero-shot

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[skip lockgen]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: experiment/visual-clip-zero-shot

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Refresh lockfile with npm
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh visual experiment lockfile [skip lockgen]"
          git push origin HEAD:experiment/visual-clip-zero-shot
