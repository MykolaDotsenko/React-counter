name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      pages_site_digest: ${{ steps.upload-pages-site.outputs.artifact-digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.52.0

      - name: Generate production CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          SBOM_FILE="shopping-budget-companion-${GITHUB_SHA}.cdx.json"

          "${{ steps.syft.outputs.cmd }}" dir:.             --select-catalogers '-github-actions-usage-cataloger,-github-action-workflow-usage-cataloger'             --source-name shopping-budget-companion             --source-version 2.0.0             -o "cyclonedx-json=${SBOM_FILE}"

          sha256sum "${SBOM_FILE}" > "${SBOM_FILE}.sha256"

      - name: Validate production CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          SBOM_FILE="shopping-budget-companion-${GITHUB_SHA}.cdx.json"

          echo "Validate CycloneDX envelope"
          jq -e '.bomFormat == "CycloneDX"' "${SBOM_FILE}" >/dev/null
          jq -e '.specVersion | type == "string"' "${SBOM_FILE}" >/dev/null

          echo "Validate product source identity"
          jq -e '.metadata.component.name == "shopping-budget-companion"' "${SBOM_FILE}" >/dev/null
          jq -e '.metadata.component.version == "2.0.0"' "${SBOM_FILE}" >/dev/null

          echo "Validate runtime dependency inventory"
          jq -e '.components | type == "array" and length > 0' "${SBOM_FILE}" >/dev/null

          while IFS= read -r dependency; do
            echo "Require runtime dependency: ${dependency}"
            jq -e --arg dependency "${dependency}"               'any(.components[]; .name == $dependency)'               "${SBOM_FILE}" >/dev/null
          done < <(jq -r '.dependencies | keys[]' package.json)

          echo "Reject development-only test packages"
          jq -e 'all(.components[]; .name != "vitest" and .name != "@vitest/coverage-v8")'             "${SBOM_FILE}" >/dev/null

          echo "Reject GitHub Actions from product SBOM"
          jq -e '[.components[] | select((.purl // "") | startswith("pkg:github/"))] | length == 0'             "${SBOM_FILE}" >/dev/null

          echo "Verify SHA-256 sidecar"
          sha256sum --check "${SBOM_FILE}.sha256"

      - name: Upload SBOM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: |
            shopping-budget-companion-${{ github.sha }}.cdx.json
            shopping-budget-companion-${{ github.sha }}.cdx.json.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run static, unit and component quality gates
        run: npm run check

      - name: Build public release artifact
        run: |
          rm -rf dist dist-qa dist-beta dist-cohort dist-barcode dist-visual site
          npm run build -- --base=/shopping-budget-companion/
          npm run build:check

      - name: Build guarded shopping timing QA
        env:
          VITE_SHOPPING_QA_TIMING: "1"
          VITE_EVIDENCE_BUILD_REVISION: ${{ github.sha }}
        run: |
          npm run build -- --base=/shopping-budget-companion/qa/ --outDir=dist-qa
          npm run qa:prepare-index

      - name: Build guarded retention beta
        env:
          VITE_SHOPPING_BETA_EVIDENCE: "1"
          VITE_EVIDENCE_BUILD_REVISION: ${{ github.sha }}
        run: |
          npm run build -- --base=/shopping-budget-companion/beta/ --outDir=dist-beta
          npm run beta:prepare-index

      - name: Build local retention cohort analyzer
        env:
          VITE_SHOPPING_COHORT_ANALYSIS: "1"
          VITE_EVIDENCE_BUILD_REVISION: ${{ github.sha }}
        run: |
          npm run build -- --base=/shopping-budget-companion/cohort/ --outDir=dist-cohort
          npm run cohort:prepare-index

      - name: Build experimental barcode benchmark
        env:
          VITE_SHOPPING_BARCODE_BENCHMARK: "1"
          VITE_EVIDENCE_BUILD_REVISION: ${{ github.sha }}
        run: |
          npm run build -- --base=/shopping-budget-companion/barcode-benchmark/ --outDir=dist-barcode
          npm run barcode:prepare-index

      - name: Build experimental visual product benchmark
        env:
          VITE_SHOPPING_VISUAL_BENCHMARK: "1"
          VITE_EVIDENCE_BUILD_REVISION: ${{ github.sha }}
        run: |
          npm run build -- --base=/shopping-budget-companion/visual-recognition-benchmark/ --outDir=dist-visual
          npm run visual:prepare-index

      - name: Stage immutable site artifact
        run: |
          mkdir -p site/qa site/beta site/cohort site/barcode-benchmark site/visual-recognition-benchmark
          cp -R dist/. site/
          cp -R dist-qa/. site/qa/
          cp -R dist-beta/. site/beta/
          cp -R dist-cohort/. site/cohort/
          cp -R dist-barcode/. site/barcode-benchmark/
          cp -R dist-visual/. site/visual-recognition-benchmark/
          touch site/.nojekyll
          test ! -e site/node_modules
          test ! -e site/package.json
          test ! -e site/package-lock.json
          test ! -e site/src
          test ! -e site/tests

      - name: Upload tested site artifact
        id: upload-pages-site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-site
          path: site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  provenance:
    needs: quality
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download exact SBOM evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-${{ github.sha }}
          path: /tmp/sbom

      - name: Verify SBOM digest before attestation
        shell: bash
        working-directory: /tmp/sbom
        run: sha256sum --check "shopping-budget-companion-${GITHUB_SHA}.cdx.json.sha256"

      - name: Attest exact pages-site build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: pages-site
          subject-digest: sha256:${{ needs.quality.outputs.pages_site_digest }}

      - name: Attest production SBOM to exact pages-site artifact
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: pages-site
          subject-digest: sha256:${{ needs.quality.outputs.pages_site_digest }}
          sbom-path: /tmp/sbom/shopping-budget-companion-${{ github.sha }}.cdx.json

      - name: Verify attestation outputs
        shell: bash
        env:
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          PROVENANCE_ID: ${{ steps.provenance.outputs.attestation-id }}
          SBOM_URL: ${{ steps.sbom-attestation.outputs.attestation-url }}
          SBOM_ID: ${{ steps.sbom-attestation.outputs.attestation-id }}
        run: |
          set -euo pipefail
          test -n "${PROVENANCE_URL}"
          test -n "${PROVENANCE_ID}"
          test -n "${SBOM_URL}"
          test -n "${SBOM_ID}"

  artifact-integrity:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-site
          path: /tmp/pages-site

      - name: Verify release artifact contents
        run: |
          test -f /tmp/pages-site/index.html
          test -f /tmp/pages-site/.nojekyll
          test -f /tmp/pages-site/manifest.webmanifest
          test -f /tmp/pages-site/sw.js
          test -f /tmp/pages-site/pwa-icon-192.png
          test -f /tmp/pages-site/pwa-icon-512.png
          test -f /tmp/pages-site/qa/index.html
          test ! -e /tmp/pages-site/qa/manifest.webmanifest
          test ! -e /tmp/pages-site/qa/sw.js
          test ! -e /tmp/pages-site/beta/manifest.webmanifest
          test ! -e /tmp/pages-site/beta/sw.js
          test ! -e /tmp/pages-site/cohort/manifest.webmanifest
          test ! -e /tmp/pages-site/cohort/sw.js
          test -f /tmp/pages-site/cohort/index.html
          test ! -e /tmp/pages-site/barcode-benchmark/manifest.webmanifest
          test ! -e /tmp/pages-site/barcode-benchmark/sw.js
          test ! -e /tmp/pages-site/visual-recognition-benchmark/manifest.webmanifest
          test ! -e /tmp/pages-site/visual-recognition-benchmark/sw.js
          test -f /tmp/pages-site/barcode-benchmark/index.html
          test -f /tmp/pages-site/visual-recognition-benchmark/index.html
          test ! -e /tmp/pages-site/node_modules
          test ! -e /tmp/pages-site/package.json
          test ! -e /tmp/pages-site/package-lock.json
          test ! -e /tmp/pages-site/src
          test ! -e /tmp/pages-site/tests
          test ! -e /tmp/pages-site/dist
          test ! -e /tmp/pages-site/dist-qa
          test ! -e /tmp/pages-site/dist-beta
          test ! -e /tmp/pages-site/dist-cohort
          test ! -e /tmp/pages-site/dist-barcode
          test ! -e /tmp/pages-site/dist-visual
          test -z "$(find /tmp/pages-site -maxdepth 1 -type f -name 'shopping-budget-companion-*.cdx.json*' -print -quit)"

  browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download exact release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-site
          path: .playwright-site-root/shopping-budget-companion

      - name: Expose production index at test origin
        run: cp .playwright-site-root/shopping-budget-companion/index.html .playwright-site-root/index.html

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run production browser and accessibility tests
        env:
          PLAYWRIGHT_STAGED_SITE: "1"
        run: npm run test:e2e -- --project=${{ matrix.browser }} --grep-invert "@qa|@beta|@cohort|@barcode-benchmark|@visual-benchmark"

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  qa-browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download exact release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-site
          path: .playwright-site-root/shopping-budget-companion

      - name: Expose timing QA index at test origin
        run: cp .playwright-site-root/shopping-budget-companion/qa/index.html .playwright-site-root/index.html

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run guarded timing QA browser tests
        env:
          PLAYWRIGHT_STAGED_SITE: "1"
          EVIDENCE_BUILD_REVISION: ${{ github.sha }}
        run: npm run test:e2e -- --project=chromium --grep @qa

      - name: Upload QA browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-qa-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  beta-browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download exact release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-site
          path: .playwright-site-root/shopping-budget-companion

      - name: Expose beta index at test origin
        run: cp .playwright-site-root/shopping-budget-companion/beta/index.html .playwright-site-root/index.html

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run guarded beta evidence browser tests
        env:
          PLAYWRIGHT_STAGED_SITE: "1"
          EVIDENCE_BUILD_REVISION: ${{ github.sha }}
        run: npm run test:e2e -- --project=chromium --grep @beta

      - name: Upload beta browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-beta-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  cohort-browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download exact release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-site
          path: .playwright-site-root/shopping-budget-companion

      - name: Expose cohort analyzer index at test origin
        run: cp .playwright-site-root/shopping-budget-companion/cohort/index.html .playwright-site-root/index.html

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run local cohort analyzer browser tests
        env:
          PLAYWRIGHT_STAGED_SITE: "1"
          EVIDENCE_BUILD_REVISION: ${{ github.sha }}
        run: npm run test:e2e -- --project=chromium --grep @cohort

      - name: Upload cohort browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-cohort-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  barcode-benchmark-browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download exact release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-site
          path: .playwright-site-root/shopping-budget-companion

      - name: Expose barcode benchmark index at test origin
        run: cp .playwright-site-root/shopping-budget-companion/barcode-benchmark/index.html .playwright-site-root/index.html

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run barcode benchmark browser tests
        env:
          PLAYWRIGHT_STAGED_SITE: "1"
          EVIDENCE_BUILD_REVISION: ${{ github.sha }}
        run: npm run test:e2e -- --project=chromium --grep @barcode-benchmark

      - name: Upload barcode benchmark failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-barcode-benchmark-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  visual-benchmark-browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download exact release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-site
          path: .playwright-site-root/shopping-budget-companion

      - name: Expose visual benchmark index at test origin
        run: cp .playwright-site-root/shopping-budget-companion/visual-recognition-benchmark/index.html .playwright-site-root/index.html

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual product benchmark browser tests
        env:
          PLAYWRIGHT_STAGED_SITE: "1"
          EVIDENCE_BUILD_REVISION: ${{ github.sha }}
        run: npm run test:e2e -- --project=chromium --grep @visual-benchmark

      - name: Upload visual benchmark browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-visual-benchmark-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [artifact-integrity, provenance, browser, qa-browser, beta-browser, cohort-browser, barcode-benchmark-browser, visual-benchmark-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: true

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download exact tested site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-site
          path: /tmp/pages-site

      - name: Verify deploy artifact cleanliness
        run: |
          test -f /tmp/pages-site/index.html
          test -f /tmp/pages-site/.nojekyll
          test -f /tmp/pages-site/manifest.webmanifest
          test -f /tmp/pages-site/sw.js
          test -f /tmp/pages-site/barcode-benchmark/index.html
          test ! -e /tmp/pages-site/barcode-benchmark/manifest.webmanifest
          test ! -e /tmp/pages-site/barcode-benchmark/sw.js
          test -f /tmp/pages-site/visual-recognition-benchmark/index.html
          test ! -e /tmp/pages-site/visual-recognition-benchmark/manifest.webmanifest
          test ! -e /tmp/pages-site/visual-recognition-benchmark/sw.js
          test ! -e /tmp/pages-site/node_modules
          test ! -e /tmp/pages-site/package.json
          test ! -e /tmp/pages-site/src
          test ! -e /tmp/pages-site/tests

      - name: Publish exact tested artifact to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gh-pages-publish
          git rm -rf . || true
          git clean -fdx
          cp -R /tmp/pages-site/. .
          git add -A
          git commit -m "deploy: tested shopping app ${GITHUB_SHA}"
          git push --force origin HEAD:gh-pages
