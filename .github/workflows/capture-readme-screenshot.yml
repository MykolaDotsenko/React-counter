name: Capture README app screenshot

on:
  push:
    branches:
      - codex/readme-app-screenshot
    paths:
      - .github/workflows/capture-readme-screenshot.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: codex/readme-app-screenshot

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start app
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/shopping-budget-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shopping-budget-vite.log
          exit 1

      - name: Capture current active-trip UI
        run: |
          mkdir -p docs/assets
          node --input-type=module <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch();
          const page = await browser.newPage({
            viewport: { width: 390, height: 844 },
            deviceScaleFactor: 2,
          });

          await page.emulateMedia({
            colorScheme: "light",
            reducedMotion: "reduce",
          });

          await page.goto("http://127.0.0.1:4173/", {
            waitUntil: "networkidle",
          });

          await page.getByRole("button", { name: "€50" }).click();
          await page.getByRole("button", { name: "Add price" }).waitFor();

          await page.screenshot({
            path: "docs/assets/shopping-budget-companion.png",
            fullPage: true,
          });

          await browser.close();
          EOF

      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/shopping-budget-companion.png
          git commit -m "docs: capture current shopping app screenshot"
          git push origin HEAD:codex/readme-app-screenshot
