name: Refresh dependency lockfile

on:
  push:
    branches: [feature/pulse-counter-hardening]
    paths:
      - package.json
      - .github/workflows/refresh-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, 'chore: refresh dependency lockfile')"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/pulse-counter-hardening

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh dependency lockfile"
          git push
