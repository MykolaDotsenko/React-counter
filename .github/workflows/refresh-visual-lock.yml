name: Refresh visual benchmark lockfile

on:
  push:
    branches: [feat/visual-recognition-benchmark]

permissions:
  contents: write

concurrency:
  group: refresh-visual-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    if: ${{ !contains(github.event.head_commit.message, 'synchronize visual benchmark lockfile') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/visual-recognition-benchmark

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Regenerate lockfile with repository npm version
        run: npx --yes npm@11.19.0 install --package-lock-only --ignore-scripts

      - name: Commit lockfile only when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize visual benchmark lockfile"
          git push origin HEAD:feat/visual-recognition-benchmark
